<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <!-- Importar Inter para el PDF (MAGA Beauty) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================
       RESET Y BASE - TEMA MAGA BEAUTY (Inter Bold)
       ========================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      background: #ffffff;
      color: #111111;
      line-height: 1.5;
    }
    .pdf-container {
      width: 794px;
      min-height: 1123px;
      padding: 48px;
      background: #ffffff;
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
    }

    /* ==========================================================
       ENCABEZADO
       ========================================================== */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header .logo-img {
      height: 50px;
      width: auto;
      display: block;
      margin: 0 auto 8px auto;
    }
    .header .badge {
      font-size: 10pt;
      font-weight: 700;
      color: #111111;
      background: #f0f0f0;
      padding: 2px 16px;
      border-radius: 4px;
      display: inline-block;
      letter-spacing: 0.5px;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
    }

    /* ==========================================================
       DIVISOR
       ========================================================== */
    .divider {
      border-top: 2px solid #111111;
      margin: 16px 0;
    }

    /* ==========================================================
       INFORMACIÓN DEL CLIENTE
       ========================================================== */
    .client-info {
      margin-bottom: 16px;
      font-size: 11pt;
      font-family: 'Inter', sans-serif;
    }
    .client-info p {
      margin: 4px 0;
    }
    .client-info strong {
      font-weight: 700;
      color: #111111;
    }

    /* ==========================================================
       TABLA DE SERVICIOS
       ========================================================== */
    .services-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 11pt;
      font-family: 'Inter', sans-serif;
    }

    .services-table th {
      background-color: #111111;
      color: #ffffff;
      font-weight: 700;
      font-size: 12pt;
      padding: 8px 12px;
      text-align: left;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .services-table th:last-child {
      text-align: right;
    }

    .service-row td {
      background-color: #ffffff;
      padding: 8px 12px;
      vertical-align: top;
      border-bottom: 1px solid #e5e5e5;
    }

    .service-name {
      font-weight: 700;
      color: #111111;
      display: block;
      margin-bottom: 4px;
      font-size: 11pt;
      font-family: 'Inter', sans-serif;
    }

    .service-detail {
      font-size: 10pt;
      font-weight: 400;
      color: #555555;
      white-space: pre-wrap;
      word-wrap: break-word;
      background-color: #f5f5f5;
      padding: 6px 10px;
      border-radius: 4px;
      border-left: 3px solid #111111;
      margin-top: 4px;
      display: block;
      line-height: 1.4;
      font-family: 'Inter', sans-serif;
    }

    .service-price {
      font-weight: 700;
      color: #111111;
      text-align: right;
      white-space: nowrap;
      display: block;
      font-size: 11pt;
      font-family: 'Inter', sans-serif;
    }

    .total-row td {
      background-color: #ffffff;
      padding: 10px 12px;
      font-weight: 800;
      color: #111111;
      font-size: 14pt;
      font-family: 'Inter', sans-serif;
      border-top: 2px solid #111111;
    }
    .total-row .total-label {
      text-align: left;
    }
    .total-row .total-value {
      text-align: right;
      white-space: nowrap;
    }

    /* ==========================================================
       PIE DE PÁGINA
       ========================================================== */
    .footer {
      margin-top: 40px;
      font-size: 9pt;
      font-weight: 400;
      color: #888888;
      border-top: 1px solid #e5e5e5;
      padding-top: 12px;
      text-align: center;
      font-family: 'Inter', sans-serif;
    }
    .footer p {
      margin: 2px 0;
    }

    @media print {
      body { padding: 0; }
      .pdf-container { margin: 0; position: static; min-height: auto; }
    }
  </style>
</head>
<body>
<div class="pdf-container">

  <div class="header">
    <img src="/data/logo-maga-beauty.png" alt="MAGA Beauty" class="logo-img" />
    <span class="badge">Cotización</span>
  </div>

  <div class="divider"></div>

  <div class="client-info">
    <p><strong>Cliente:</strong> {{clientName}}</p>
    <p><strong>Producto o servicio:</strong> {{productName}}</p>
    <p><strong>Fecha:</strong> {{date}}</p>
  </div>

  <div class="divider"></div>

  <table class="services-table">
    <thead>
      <tr>
        <th>Servicio</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody>
      {{servicesRows}}
      <tr class="total-row">
        <td class="total-label">Total</td>
        <td class="total-value">{{total}}</td>
      </tr>
    </tbody>
  </table>

  <div class="footer">
    <p>Esta cotización es válida por 30 días.</p>
    <p>Powered by actols.com</p>
  </div>

</div>
</body>
</html>
